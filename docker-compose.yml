# Three actordb nodes on a private network. Each service runs one
# scenario role from the actordb-docker-test image; the role is chosen
# per scenario via the env files in docker/envs/, e.g.
#
#   docker compose --env-file docker/envs/replication.env up
#
# Build cache: layers are shared with GitHub Actions' cache backend so
# dependency compilation is reused across workflow runs. Requires Buildx
# (docker/setup-buildx-action@v3) in the workflow for `type=gha` to work.

x-build-cache: &build-cache
  cache_from:
    - type=gha
  cache_to:
    - type=gha,mode=max

services:
  node-a:
    container_name: "node-a"
    build:
      context: .
      dockerfile: docker-tests/Dockerfile
      <<: *build-cache
    image: actordb-docker-test:latest
    networks:
      - test-net
    command: ${A_TEST}

  node-b:
    depends_on:
      - node-a
    container_name: "node-b"
    build:
      context: .
      dockerfile: docker-tests/Dockerfile
      <<: *build-cache
    image: actordb-docker-test:latest
    networks:
      - test-net
    command: ${B_TEST}

  node-c:
    depends_on:
      - node-b
    container_name: "node-c"
    build:
      context: .
      dockerfile: docker-tests/Dockerfile
      <<: *build-cache
    image: actordb-docker-test:latest
    networks:
      - test-net
    command: ${C_TEST}

networks:
  test-net:
