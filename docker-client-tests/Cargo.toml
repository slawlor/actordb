[package]
name = "docker-client-tests"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "External-process SDK scenarios for ActorDB"

[[bin]]
name = "actordb-docker-client-test"
path = "src/main.rs"

[[bin]]
name = "actordb-docker-cluster-client"
path = "src/cluster_client.rs"

[dependencies]
actordb-client = { version = "0.10.0", path = "../actordb-client" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
clap = { version = "4", features = ["derive"] }
seahash = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
