name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  msrv:
    name: Rust 1.88 minimum version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check backend-free defaults
        run: cargo check --workspace --exclude docker-tests --all-targets --locked

      - name: Check the locked workspace with every opt-in
        run: cargo check --workspace --all-features --all-targets --locked

  test:
    name: Run the default tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Test/link native artifacts differ from Clippy's check-only cache.
          # Exact-hit caches are immutable, so tests need their own warmed key.
          shared-key: stable-debug-tests

      - name: Test backend-free defaults
        # The Docker role explicitly opts into RocksDB. Exclude it to verify
        # the actual default library, not workspace feature unification.
        run: cargo test --workspace --exclude docker-tests --locked

      - name: Test the memory test double without RocksDB
        run: cargo test --workspace --exclude docker-tests --features actordb/memory --locked

      - name: Test everything with explicit backend opt-ins
        run: cargo test --workspace --all-features --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install minimal stable with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable-debug

      - name: Run Clippy on backend-free defaults
        run: cargo clippy --workspace --exclude docker-tests --all-targets --locked -- -D clippy::all -D warnings

      - name: Run Clippy with only the memory test double
        run: cargo clippy --workspace --exclude docker-tests --features actordb/memory --all-targets --locked -- -D clippy::all -D warnings

      - name: Run Clippy with every backend opt-in
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D clippy::all -D warnings

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install minimal stable with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run rustfmt
        run: cargo fmt --all -- --check

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install minimal stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-docs

      - name: Run cargo doc on release profile
        run: cargo doc --lib --release --all-features --locked

  benches:
    name: benches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-benches

      - name: Compile benchmarks
        run: cargo bench --workspace --all-features --no-run --locked
