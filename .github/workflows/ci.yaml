name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  msrv:
    name: Rust 1.88 minimum version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      - name: Check the locked workspace
        run: cargo check --workspace --all-targets --locked

  test:
    name: Run the default tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Test/link native artifacts differ from Clippy's check-only cache.
          # Exact-hit caches are immutable, so tests need their own warmed key.
          shared-key: stable-debug-tests

      - name: Test everything
        run: cargo test --workspace --locked

      - name: Test without default features
        # docker-tests opts into actordb's defaults through its dependency;
        # excluding it is necessary to exercise a genuinely RocksDB-free build.
        run: cargo test --workspace --exclude docker-tests --no-default-features --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install minimal stable with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable-debug

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D clippy::all -D warnings

      - name: Run Clippy without default features
        run: cargo clippy --workspace --exclude docker-tests --all-targets --no-default-features --locked -- -D clippy::all -D warnings

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install minimal stable with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run rustfmt
        run: cargo fmt --all -- --check

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install minimal stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-docs

      - name: Run cargo doc on release profile
        run: cargo doc --lib --release --locked

  benches:
    name: benches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-benches

      - name: Compile benchmarks
        run: cargo bench --workspace --no-run --locked
