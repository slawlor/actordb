name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  companion:
    name: Standalone Rust companions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Check SDK without server or native dependencies
        run: cargo check --package actordb-client --lib --no-default-features
      - name: Verify the external client cannot link a database node
        run: |
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(
              ['cargo', 'tree', '--package', 'docker-client-tests', '--edges', 'normal,build', '--prefix', 'none'],
              capture_output=True, text=True, check=True,
          )
          forbidden = {'actordb', 'ractor', 'rocksdb', 'librocksdb-sys', 'protobuf-src', 'prost-build'}
          actual = {line.split()[0] for line in result.stdout.splitlines() if line.strip()}
          assert not actual & forbidden, f'External client links server dependencies: {actual & forbidden}'
          print('External client links only SDK dependencies.')
          PY
      - name: Test portable query and protocol contracts
        run: cargo test --package actordb-query --package actordb-protocol
      - name: Verify generated protocol bindings match the schemas
        run: cargo run --package actordb-protocol --features codegen --bin generate -- --check

  msrv:
    name: Rust 1.88 minimum version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.88
        # Track action updates separately from the supported compiler version.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check backend-free defaults
        run: cargo check --workspace --exclude docker-tests --all-targets

      - name: Check the workspace with every opt-in
        run: cargo check --workspace --all-features --all-targets

  test:
    name: Run the default tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Test/link native artifacts differ from Clippy's check-only cache.
          # Exact-hit caches are immutable, so tests need their own warmed key.
          shared-key: stable-debug-tests

      - name: Test backend-free defaults
        # The Docker role explicitly opts into RocksDB. Exclude it to verify
        # the actual default library, not workspace feature unification.
        run: cargo test --workspace --exclude docker-tests

      - name: Test the memory test double without RocksDB
        run: cargo test --workspace --exclude docker-tests --features actordb/memory

      - name: Test everything with explicit backend opt-ins
        run: cargo test --workspace --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install minimal stable with clippy
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable-debug

      - name: Run Clippy on backend-free defaults
        run: cargo clippy --workspace --exclude docker-tests --all-targets -- -D clippy::all -D warnings

      - name: Run Clippy with only the memory test double
        run: cargo clippy --workspace --exclude docker-tests --features actordb/memory --all-targets -- -D clippy::all -D warnings

      - name: Run Clippy with every backend opt-in
        run: cargo clippy --workspace --all-features --all-targets -- -D clippy::all -D warnings

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install minimal stable with rustfmt
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt

      - name: Run rustfmt
        run: cargo fmt --all -- --check

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install minimal stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-docs

      - name: Run cargo doc on release profile
        run: cargo doc --lib --release --all-features

  benches:
    name: benches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-benches

      - name: Compile benchmarks
        run: cargo bench --workspace --all-features --no-run
