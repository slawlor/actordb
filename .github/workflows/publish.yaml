name: Publish

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

# Serialize crates.io uploads; never cancel an in-flight publication. PR and
# main validation have independent groups and cannot trigger an upload.
concurrency:
  group: actordb-release-${{ github.event_name == 'release' && 'crates-io' || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify release package
    if: github.event_name != 'release' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the event commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          # The release guard needs main's history, not just the tagged commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Unpacked package builds do not unify the workspace's dev features.
          # Keep their native artifacts separate from immutable test caches.
          shared-key: stable-release-package

      - name: Test release guards
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s .github/scripts -p 'test_verify_release.py' -v

      - name: Check the bundled license matches the workspace license
        run: cmp LICENSE actordb/LICENSE

      - name: Verify crate version and release provenance
        id: release
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$RELEASE_EVENT" = release ]; then
            python3 .github/scripts/verify_release.py --tag "$RELEASE_TAG"
          else
            python3 .github/scripts/verify_release.py
          fi

      - name: Verify the backend-free default package
        # Stage companion dependencies together before checking dependent crates.
        run: cargo publish --dry-run --package actordb-protocol --package actordb-query --package actordb --package actordb-client --registry crates-io

      - name: Verify the opt-in memory test double
        run: cargo publish --dry-run --package actordb-protocol --package actordb-query --package actordb --package actordb-client --registry crates-io --features actordb/memory

      - name: Create the verified release artifact
        # Modern Cargo stages publish dry-runs in a temporary registry rather
        # than the normal package directory. Do not depend on internal paths.
        run: cargo package --package actordb-protocol --package actordb-query --package actordb --package actordb-client

      # PR/main CI owns RocksDB validation. Publication only repeats the cheap
      # backend-free and memory checks; never build the native backend here.
      - name: Test the backend-free release and memory test double
        if: github.event_name == 'release'
        run: |
          cargo test --package actordb
          cargo test --package actordb --features memory

      - name: Upload the verified crate for inspection
        uses: actions/upload-artifact@v7
        with:
          name: actordb-workspace-${{ steps.release.outputs.version }}
          path: target/package/*.crate
          if-no-files-found: error

      - name: Publish libraries to crates.io in dependency order
        if: github.event_name == 'release'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo 'Set CARGO_REGISTRY_TOKEN to a token authorized to publish the ActorDB library packages.' >&2
            exit 1
          fi
          cargo publish --package actordb-protocol --package actordb-query --package actordb --package actordb-client --registry crates-io
