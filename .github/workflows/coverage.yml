name: Code Coverage
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  coverage:
    name: Coverage using xtask
    strategy:
      matrix:
        os: [ubuntu-latest]
        rust: [stable]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          # Codecov labels PR reports with the head commit, not the synthetic
          # merge commit. Measure that same source; push reports use github.sha.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify coverage source identity
        env:
          COVERAGE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$COVERAGE_COMMIT_SHA"

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ matrix.rust }}
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Download grcov
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -sL https://github.com/mozilla/grcov/releases/download/v0.8.10/grcov-x86_64-unknown-linux-gnu.tar.bz2 | tar jxf - -C "${HOME}/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Run xtask coverage
        run: cargo run --bin xtask -- coverage
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          files: coverage/*.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
