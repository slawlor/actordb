[package]
name = "docker-tests"
version = "0.4.0"
authors = ["Sean Lawlor"]
description = "Dockerized multi-node integration test scenarios for actordb"
license = "MIT"
edition = "2021"
rust-version = "1.88"
publish = false

[[bin]]
name = "actordb-docker-test"
path = "src/main.rs"

[dependencies]
actordb = { version = "0.5.2", path = "../actordb", default-features = false, features = ["rocksdb"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "signal"] }
