[package]
name = "docker-tests"
version = "0.1.0"
authors = ["Sean Lawlor"]
description = "Dockerized multi-node integration test scenarios for actordb"
license = "MIT"
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "actordb-docker-test"
path = "src/main.rs"

[dependencies]
actordb = { path = "../actordb", features = ["rocksdb"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
