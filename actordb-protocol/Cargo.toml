[package]
name = "actordb-protocol"
version = "0.6.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Language-neutral peer and application wire contracts for ActorDB"

[features]
codegen = ["dep:prost-build", "dep:protobuf-src"]

[dependencies]
bon = "3.10.2"
prost = "0.14"
hmac = "0.13"
sha2 = "0.11"
prost-build = { version = "0.14", optional = true }
protobuf-src = { version = "2.1", optional = true }

[[bin]]
name = "generate"
required-features = ["codegen"]
