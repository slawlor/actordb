[package]
name = "actordb-protocol"
version = "0.11.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Language-neutral peer and application wire contracts for ActorDB"
readme = "README.md"

[features]
codegen = ["dep:prost-build", "dep:protoc-bin-vendored"]
grpc = ["dep:tonic", "dep:bytes"]

[dependencies]
bon = "3.10.2"
prost = "0.14"
sha2 = "0.11"
prost-build = { version = "0.14", optional = true }
protoc-bin-vendored = { version = "3", optional = true }
tonic = { version = "0.14", optional = true, default-features = false, features = ["codegen"] }
bytes = { version = "1", optional = true }

[[bin]]
name = "generate"
required-features = ["codegen"]
