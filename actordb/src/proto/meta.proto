// ============================================================
// Protobuf protocol specification. This is the top-level "meta" API
// and inner APIs will be included here
// ============================================================

syntax = "proto3";

// import "auth.proto";
// import "node.proto";
// import "control.proto";

package meta;

// Handshake: identifies the connecting node
message Hello {
  string node_id = 1;
}

// A single replicated write, sent from a fragment's coordinator to the
// other replica holders. Delivery is at-least-once; receivers merge with
// last-writer-wins on (timestamp_ms, node_id) and do NOT re-forward.
// `seq`/`boot_id` are propagation metadata.
message ReplicateOp {
  string key = 1;
  bytes value = 2;
  uint64 timestamp_ms = 3;
  string node_id = 4;
  uint64 seq = 5;
  // Random per process start; joins the dedup key so a restarted node
  // (same node_id, sequence counter back at zero) is not mistaken for
  // a replay of its pre-restart ops.
  uint64 boot_id = 6;
  // Optional key expiry (wall-clock ms). 0/absent = no expiry.
  uint64 expires_at_ms = 7;
  // True if this is a deletion tombstone.
  bool is_tombstone = 8;
}

// A client-routed write: "you own this key's fragment — apply it as
// coordinator and replicate to the other holders." One network hop.
message ForwardedPut {
  string key = 1;
  bytes value = 2;
  uint64 timestamp_ms = 3;
  string node_id = 4;
  uint64 seq = 5;
  uint64 boot_id = 6;
  // Optional key expiry (wall-clock ms). 0/absent = no expiry.
  uint64 expires_at_ms = 7;
  // True if this is a deletion tombstone.
  bool is_tombstone = 8;
}

// A client-routed read: "you own this key's fragment — read it and
// reply." One network hop.
message ForwardedGet {
  string key = 1;
  uint64 req_id = 2;
}

message GetResponse {
  uint64 req_id = 1;
  bool found = 2;
  bytes value = 3;
  uint64 timestamp_ms = 4;
  string node_id = 5;
  // Optional key expiry (wall-clock ms). 0/absent = no expiry.
  uint64 expires_at_ms = 6;
  // True if this is a deletion tombstone.
  bool is_tombstone = 7;
}

// Ask a peer for the fragments listed (anti-entropy when a node joins
// or a peer returns). Empty = all fragments the peer holds.
message SyncRequest {
  repeated uint32 fragments = 1;
}

// A peer's full local state
message SyncResponse {
  repeated SyncEntry entries = 1;
}

message SyncEntry {
  string key = 1;
  bytes value = 2;
  uint64 timestamp_ms = 3;
  string node_id = 4;
  // Optional key expiry (wall-clock ms). 0/absent = no expiry.
  uint64 expires_at_ms = 5;
  // True if this is a deletion tombstone.
  bool is_tombstone = 6;
}

// Top-level wire envelope, length-delimited on the wire
// Phase 5: async sender/receiver replication. The sender batches ops
// per (fragment, peer) and ships them on a timer; the receiver acks
// each batch. Session ids distinguish pairings across reconnects;
// stale batches (old session) are discarded.
message SessionStart {
  uint64 session_id = 1;
  uint32 fragment = 2;
}

message ReplicateBatch {
  uint64 session_id = 1;
  uint64 batch_seq = 2;
  uint32 fragment = 3;
  repeated ReplicateOp ops = 4;
}

message BatchAck {
  uint64 session_id = 1;
  uint64 batch_seq = 2;
  uint32 fragment = 3;
}

// Incremental anti-entropy: exchange (timestamp, tombstone) summaries,
// then only the divergent keys.
message KeySummary {
  string key = 1;
  uint64 timestamp_ms = 2;
  string node_id = 3;
  bool is_tombstone = 4;
}

message ReconcileRequest {
  uint32 fragment = 1;
}

message ReconcileResponse {
  uint32 fragment = 1;
  repeated KeySummary summaries = 2;
}

message ReconcileFetch {
  uint32 fragment = 1;
  repeated string keys = 2;
}

message ReconcileData {
  uint32 fragment = 1;
  repeated SyncEntry entries = 2;
}

message Envelope {
  oneof msg {
    Hello hello = 1;
    // Phase 5: ReplicateOp (2) retired; batches carry Repeated ReplicateOp.
    SyncRequest sync_request = 3;
    SyncResponse sync_response = 4;
    ForwardedPut forwarded_put = 5;
    ForwardedGet forwarded_get = 6;
    GetResponse get_response = 7;
    SessionStart session_start = 8;
    ReplicateBatch replicate_batch = 9;
    BatchAck batch_ack = 10;
    ReconcileRequest reconcile_request = 11;
    ReconcileResponse reconcile_response = 12;
    ReconcileFetch reconcile_fetch = 13;
    ReconcileData reconcile_data = 14;
  }
}
