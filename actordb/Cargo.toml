[package]
name = "actordb"
version = "0.3.1"
authors = ["Sean Lawlor"]
description = "An actor-first distributed database"
documentation = "https://docs.rs/actordb"
license = "MIT"
edition = "2021"
keywords = ["actor", "ractor", "db", "database"]
repository = "https://github.com/slawlor/actordb"
readme = "../README.md"
homepage = "https://github.com/slawlor/actordb"
categories = ["asynchronous", "concurrency", "database-implementations"]
build = "src/build.rs"
rust-version = "1.88"

[build-dependencies]
protobuf-src = "1.1.0"
prost-build = { version = "0.14" }

[features]
default = []
# Optional no-op store test double; not a durable database or the Node cache.
memory = []
# Opt-in RocksDB-backed durable storage. Independent of the memory feature.
# librocksdb-sys runs bindgen at build time and needs libclang with working
# header paths. The default crate includes no bundled store implementation.
rocksdb = ["dep:rocksdb"]

[dependencies]
# Required dependencies
bon = { version = "3.10.2" }
bytes = { version = "1" }
futures = { version = "0.3" }
getrandom = { version = "0.4.3" }
hmac = { version = "0.13.0" }
prost = { version = "0.14" }
prost-types = { version = "0.14" }
ractor = { version = "0.16" }
rocksdb = { version = "0.25", optional = true }
seahash = { version = "4" }
sha2 = { version = "0.11.1" }
tokio = { version = "1", features = ["sync", "time", "net", "io-util"] }
tracing = "0.1"
# Optional dependencies

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "rt-multi-thread", "signal", "test-util"] }
tracing-glog = "0.4.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"]}
tracing-test = "0.2"

[[bench]]
name = "put_get"
harness = false

[[bench]]
name = "fanout"
harness = false

[[bench]]
name = "replication"
harness = false

[[bench]]
name = "sender_registry"
harness = false
