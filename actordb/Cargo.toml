[package]
name = "actordb"
version = "0.8.1"
authors = ["Sean Lawlor"]
description = "An actor-first distributed database"
documentation = "https://docs.rs/actordb"
license = "MIT"
edition = "2021"
keywords = ["actor", "ractor", "db", "database"]
repository = "https://github.com/slawlor/actordb"
readme = "../README.md"
homepage = "https://github.com/slawlor/actordb"
categories = ["asynchronous", "concurrency", "database-implementations"]
rust-version = "1.88"

[features]
default = []
# Optional no-op store test double; not a durable database or the Node cache.
memory = []
# Opt-in RocksDB-backed durable storage. Independent of the memory feature.
# librocksdb-sys runs bindgen at build time and needs libclang with working
# header paths. The default crate includes no bundled store implementation.
rocksdb = ["dep:rocksdb"]
# Built-in rustls transport for the pluggable peer/application network.
tls = ["dep:tokio-rustls"]
# Optional static configuration-file loader. Dynamic providers only need the
# always-available async `ConfigurationProvider` trait.
toml = ["dep:serde", "dep:toml", "tokio/fs"]

[dependencies]
actordb-protocol = { version = "0.8.1", path = "../actordb-protocol" }
actordb-query = { version = "0.8.1", path = "../actordb-query" }
# Required dependencies
bon = { version = "3.10.2" }
bytes = { version = "1" }
futures = { version = "0.3" }
getrandom = { version = "0.4.3" }
hmac = { version = "0.13.0" }
prost = { version = "0.14" }
prost-types = { version = "0.14" }
ractor = { version = "0.16" }
serde = { version = "1", features = ["derive"], optional = true }
rocksdb = { version = "0.25", optional = true }
seahash = { version = "4" }
sha2 = { version = "0.11.1" }
tokio = { version = "1", features = ["sync", "time", "net", "io-util"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
toml = { version = "0.9", optional = true }
tracing = "0.1"
# Optional dependencies

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "rt-multi-thread", "signal", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing-glog = "0.4.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"]}
tracing-test = "0.2"

[[bench]]
name = "put_get"
harness = false

[[bench]]
name = "fanout"
harness = false

[[bench]]
name = "replication"
harness = false

[[bench]]
name = "sender_registry"
harness = false

[[bench]]
name = "expiry"
harness = false

[[bench]]
name = "query"
harness = false
